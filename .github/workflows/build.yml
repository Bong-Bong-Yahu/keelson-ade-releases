name: Build

# Builds Keelson ADE from its private source repo on GitHub's free public-repo
# runners. Only the owner can start it (workflow_dispatch; no push/PR triggers,
# so a fork can never run it with the token). The source is checked out with
# GH_TOKEN and never printed; installers land as artifacts, and publish=true
# makes them a release here, which is the app's auto-update feed.
on:
  workflow_dispatch:
    inputs:
      ref: { description: 'Branch or tag of Bong-Bong-Yahu/aegis-ade', required: true, default: main }
      publish: { description: 'Publish a release (auto-update feed)', type: boolean, default: false }

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: Bong-Bong-Yahu/aegis-ade, ref: '${{ inputs.ref }}', token: '${{ secrets.GH_TOKEN }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run
      # build and smoke even when a unit test fails: the job stays red, but the
      # installer and the smoke verdict are still there to look at
      - if: ${{ !cancelled() }}
        run: npx vite build
      - if: ${{ !cancelled() }}
        run: npx electron-builder --win --publish never
      - name: Install silently, then smoke the installed app
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $setup = Get-ChildItem release\Keelson-ADE-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Keelson ADE\Keelson ADE.exe"
          if (-not (Test-Path $exe)) { Write-Error "installer did not put $exe"; exit 1 }
          $p = Start-Process $exe -ArgumentList '--smoke' -Wait -PassThru -RedirectStandardOutput smoke.out -RedirectStandardError smoke.err
          Get-Content smoke.out, smoke.err
          if ($p.ExitCode -ne 0) { Write-Error "smoke exited $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path smoke.out -Pattern 'SMOKE OK' -Quiet)) { Write-Error 'no SMOKE OK'; exit 1 }
      # A terminal must show text: the installed app, seeded with one restored
      # Claude chat agent (team view) and then one shell (grid view), presses
      # Terminal the way a person does and measures what was drawn (smoketerm.js).
      - name: Terminal smoke (team view chat Terminal, grid shell)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          npm i -g @anthropic-ai/claude-code | Out-Null
          $exe = "$env:LOCALAPPDATA\Programs\Keelson ADE\Keelson ADE.exe"
          $proj = "$env:RUNNER_TEMP\proj"; New-Item -ItemType Directory -Force $proj | Out-Null
          git -C $proj init -q
          $cfg = "$env:APPDATA\aegis-ade"; New-Item -ItemType Directory -Force $cfg | Out-Null
          $fail = 0
          foreach ($run in @(@{ view = 'team'; agent = 'claude'; id = 't1' }, @{ view = 'grid'; agent = 'shell'; id = 'g1' })) {
            $wb = @{ version = 1; activeWorkspaceId = 'w1'; ui = @{ view = $run.view }
              workspaces = @(@{ id = 'w1'; title = 'proj'; cwd = $proj; color = '#d9b766'; slots = @(@{ id = $run.id; agent = $run.agent }) }) }
            $wb | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8NoBOM "$cfg\workbench.json"
            $out = "$env:RUNNER_TEMP\smoke-shots\$($run.view)"
            # WaitForExit on the app alone: Start-Process -Wait would wait on the detached daemon and slot hosts too
            $p = Start-Process $exe -ArgumentList '--smoke', '--smoke-term', "--smoke-out=$out" -PassThru -RedirectStandardOutput "smoke-term-$($run.view).out" -RedirectStandardError "smoke-term-$($run.view).err"
            if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; Write-Host "smoke-term $($run.view) hung" }
            Get-Content "smoke-term-$($run.view).out" | Select-String 'SMOKE|board|slot'
            if (-not (Select-String -Path "smoke-term-$($run.view).out" -Pattern 'SMOKE OK' -Quiet)) { $fail = 1 }
          }
          Get-Content "$env:TEMP\aegis-ade\boardd.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          exit $fail
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: terminal-smoke-shots
          path: ${{ runner.temp }}/smoke-shots
          if-no-files-found: warn
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: keelson-ade-windows
          path: |
            release/Keelson-ADE-Setup-*.exe
            release/Keelson-ADE-Portable-*.exe
          if-no-files-found: error
      # publishes only when asked, and only after tests and the smoke passed
      # (electron-builder names the release v<package.json version>)
      - name: Publish release (publish=true only)
        if: ${{ success() && inputs.publish }}
        env: { GH_TOKEN: '${{ secrets.GH_TOKEN }}' }
        run: npx electron-builder --win --publish always

  linux:
    # after windows: a release is never published half-made (Linux files, no Windows ones)
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: Bong-Bong-Yahu/aegis-ade, ref: '${{ inputs.ref }}', token: '${{ secrets.GH_TOKEN }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run
      - if: ${{ !cancelled() }}
        run: npx vite build
      - if: ${{ !cancelled() }}
        run: npx electron-builder --linux --publish never
      - name: Smoke the packaged app
        if: ${{ !cancelled() }}
        run: |
          xvfb-run -a release/linux-unpacked/aegis-ade --smoke --no-sandbox | tee smoke.out
          grep -q 'SMOKE OK' smoke.out
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: keelson-ade-linux
          path: release/Keelson-ADE-*.AppImage
          if-no-files-found: error
      # publishes only when asked, and only after tests and the smoke passed
      # (electron-builder names the release v<package.json version>)
      - name: Publish release (publish=true only)
        if: ${{ success() && inputs.publish }}
        env: { GH_TOKEN: '${{ secrets.GH_TOKEN }}' }
        run: npx electron-builder --linux --publish always
